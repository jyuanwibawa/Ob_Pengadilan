<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCourt Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-card">
        <div class="logo-box">
            <i class="fa-solid fa-sparkles"></i> </div>
        
        <h2>CleanCourt</h2>
        <p class="subtitle">Sistem Manajemen Kebersihan</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock-open"></i> <input type="password" id="password" placeholder="Masukkan password" required>
                </div>
            </div>

            <button type="submit" class="btn-login">Login ke Akun</button>
        </form>
    </div>

    <div class="footer-text">
        &copy; 2025 CleanCourt. All rights reserved.
    </div>

    <script src="js/login.js"></script>

</body>
</html>
